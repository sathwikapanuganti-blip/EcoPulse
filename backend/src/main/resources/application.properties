# ========================================================
# EcoPulse Backend Application Configuration
# ========================================================
spring.application.name=ecopulse-backend
server.port=8080

# Primary Database Config:
# By default, uses H2 In-Memory DB so the application runs immediately without installing MySQL.
# In production or when MySQL is present, provide DB_URL, DB_USERNAME, DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:h2:mem:ecopulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA & Hibernate Settings
# Hibernate automatically selects the optimal dialect (H2 or MySQL) from the connection URL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console during local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Authentication Config
jwt.secret=${JWT_SECRET:EcoPulseSecretKeyForJwtTokenGenerationSecurityKeyMustBe256BitsLongAtLeast1234567890!}
jwt.expiration-ms=86400000

# External API Integrations (Environment Variables)
# Open-Meteo Air Quality & Weather API is open and free, requiring no API key.
# If an optional commercial API is configured, provide AIR_QUALITY_API_KEY.
airquality.api.key=${AIR_QUALITY_API_KEY:}
airquality.api.base-url=https://air-quality-api.open-meteo.com/v1/air-quality
weather.api.base-url=https://api.open-meteo.com/v1/forecast

# Cache & Rate Limiting
cache.ttl.minutes=15

# CORS Allowed Origins
cors.allowed-origins=*
